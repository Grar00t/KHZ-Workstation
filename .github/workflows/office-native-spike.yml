name: Office native spike

on:
  push:
    paths:
      - 'windows/KHZ.Office.Native/**'
      - 'windows/KHZ.Office.Spike/**'
      - 'acceptance/corpus/FormulaCompatibility.xlsx'
      - '.github/workflows/office-native-spike.yml'
  pull_request:
    paths:
      - 'windows/KHZ.Office.Native/**'
      - 'windows/KHZ.Office.Spike/**'
      - 'acceptance/corpus/FormulaCompatibility.xlsx'
      - '.github/workflows/office-native-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  spike:
    name: Build and measure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The zero-dependency choice is part of the design. Enforce it here so it
      # cannot decay into a preference that a future commit quietly drops.
      - name: Assert the engine declares no third-party dependencies
        shell: pwsh
        run: |
          $csproj = 'windows/KHZ.Office.Native/KHZ.Office.Native.csproj'
          if ((Get-Content -Path $csproj -Raw) -match 'PackageReference') {
            Write-Host 'FAIL: KHZ.Office.Native declares a PackageReference.'
            Write-Host 'Zero third-party dependencies is a design constraint of this engine, not a preference.'
            exit 1
          }
          Write-Host 'OK: no PackageReference in KHZ.Office.Native.'

      # The application build is already verified working. This branch must not
      # be able to break it, and that is checkable rather than promised.
      - name: Assert the application build is untouched
        shell: pwsh
        run: |
          $app = Get-Content -Path 'windows/KHZ.App/KHZ.App.csproj' -Raw
          if ($app -match 'KHZ\.Office\.(Native|Spike)') {
            Write-Host 'FAIL: KHZ.App references a spike project.'
            exit 1
          }
          $sln = Get-Content -Path 'windows/KHZ.Workstation.sln' -Raw
          if ($sln -match 'KHZ\.Office\.(Native|Spike)') {
            Write-Host 'FAIL: a spike project was added to KHZ.Workstation.sln, which changes the existing CI build.'
            exit 1
          }
          Write-Host 'OK: application project and solution are unaffected.'

      - name: Restore
        run: dotnet restore windows/KHZ.Office.Spike/KHZ.Office.Spike.csproj

      - name: Build
        run: dotnet build windows/KHZ.Office.Spike/KHZ.Office.Spike.csproj -c Release --no-restore

      # The exit code is captured rather than allowed to abort the job, because a
      # failing measurement is the result most worth reading and the report must
      # survive to be uploaded. The dedicated gate below re-applies it.
      - name: Run measurement harness
        id: harness
        shell: pwsh
        run: |
          $workbook = Join-Path $PWD 'acceptance/corpus/FormulaCompatibility.xlsx'
          $report = Join-Path $PWD 'acceptance/reports/native-formula-spike.json'
          dotnet run --project windows/KHZ.Office.Spike/KHZ.Office.Spike.csproj -c Release --no-build -- $workbook $report
          $code = $LASTEXITCODE
          Write-Host "harness exit code: $code"
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Publish measurement to the job summary
        if: always()
        shell: pwsh
        run: |
          $path = 'acceptance/reports/native-formula-spike.json'
          $header = 'Native SpreadsheetML spike - ${{ matrix.os }}'
          if (-not (Test-Path -Path $path)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
              "## $header",
              '',
              'No report was produced: the harness did not reach its reporting stage.'
            )
            exit 0
          }
          $r = Get-Content -Path $path -Raw | ConvertFrom-Json
          $rate = [math]::Round(($r.matchRate * 100), 2)
          $unsupported = 'none'
          if ($r.formulas.unsupportedFunctions.Count -gt 0) {
            $unsupported = $r.formulas.unsupportedFunctions -join ', '
          }
          $lines = @(
            "## $header",
            '',
            "Engine: $($r.engine.displayName) $($r.engine.version)",
            '',
            "in-process **$($r.engine.inProcess)** / external process **$($r.engine.requiresExternalProcess)** / network socket **$($r.engine.requiresNetworkSocket)**",
            '',
            '| Measurement | Result |',
            '| --- | --- |',
            "| Formula agreement | **$rate %** ($($r.formulas.matched)/$($r.formulas.compared)) |",
            "| No-op round trip | **$($r.roundTrip.verdict)** ($($r.roundTrip.identicalParts)/$($r.roundTrip.totalParts) parts byte-identical) |",
            "| Single-cell mutation | **$($r.mutation.verdict)** |",
            '',
            '| Detail | Count |',
            '| --- | --- |',
            "| Formula cells | $($r.formulas.total) |",
            "| Evaluated | $($r.formulas.evaluated) |",
            "| Parse failures | $($r.formulas.parseFailures) |",
            "| Cycles | $($r.formulas.cycles) |",
            "| Shared-formula followers, unresolved | $($r.formulas.sharedFormulaFollowers) |",
            "| Excluded, no cached baseline | $($r.formulas.excludedNoBaseline) |",
            "| Distinct functions in corpus | $($r.formulas.distinctFunctions) |",
            "| Package parts | $($r.workbook.partCount) |",
            "| Parts the reader did not interpret | $($r.workbook.unknownPartCount) |",
            '',
            "Unsupported functions found in the corpus: $unsupported",
            '',
            "Deterministic clock: $($r.deterministicClockUtc)",
            '',
            'A high agreement rate on one corpus says nothing about layout, rendering or pagination, which this spike does not touch.'
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-formula-spike-${{ matrix.os }}
          path: acceptance/reports/native-formula-spike.json
          if-no-files-found: warn

      - name: Enforce the fidelity criteria
        if: always()
        shell: pwsh
        run: |
          $code = '${{ steps.harness.outputs.exit_code }}'
          if ([string]::IsNullOrWhiteSpace($code)) {
            Write-Host 'The harness did not run, so no fidelity claim can be made.'
            exit 1
          }
          switch ($code) {
            '0' {
              Write-Host 'Round-trip and mutation fidelity both held.'
              exit 0
            }
            '2' {
              Write-Host 'FAIL: corpus workbook not found. This is a wiring problem, not a fidelity result.'
              exit 1
            }
            '3' {
              Write-Host 'FAIL: a fidelity check failed. Byte preservation is the load-bearing claim of this spike; see the job summary.'
              exit 1
            }
            default {
              Write-Host "FAIL: harness exited with $code."
              exit 1
            }
          }
