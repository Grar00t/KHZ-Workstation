name: KHZ Asset Register pilot

on:
  workflow_dispatch:
  push:
    branches:
      - pilot/asset-register-work
    paths:
      - 'windows/KHZ.AssetRegister/**'
      - '.github/workflows/asset-register-pilot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore windows/KHZ.AssetRegister/KHZ.AssetRegister.csproj -r win-x64

      - name: Audit NuGet packages
        run: dotnet list windows/KHZ.AssetRegister/KHZ.AssetRegister.csproj package --vulnerable --include-transitive

      - name: Publish self-contained win-x64
        run: dotnet publish windows/KHZ.AssetRegister/KHZ.AssetRegister.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/KHZ.AssetRegister

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHZ-AssetRegister-win-x64
          path: dist/KHZ.AssetRegister/**
          if-no-files-found: error
          retention-days: 14
