name: KHZ verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare Python build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install host
        run: python -m pip install --no-build-isolation -e ".[automation]"
      - name: Compile
        run: python -m compileall -q src tests scripts tools/office-spike
      - name: Validate Office launcher syntax
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n tools/office-spike/start-spike.sh
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: NO_AI_BASELINE
        env:
          PYTHONPATH: src
        run: python scripts/no_ai_baseline.py

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore Windows app
        run: dotnet restore windows/KHZ.Workstation.sln
      - name: Build Windows app
        run: dotnet build windows/KHZ.Workstation.sln -c Release --no-restore
